# DetourLoop — Codemagic CI/CD
# Repo root = this folder (detour/). The mobile app lives in apps/mobile.
#
# Workflows
#   android-apk     Installable APK for testing on any Android phone. No setup needed:
#                   until you upload a keystore, the release APK is signed with the debug key
#                   (fine for sideloading, not for Google Play).
#   ios-testflight  IPA uploaded to TestFlight. Uses the App Store Connect API key "DYNOMARK"
#                   (Codemagic → Settings → Integrations → Developer Portal) and needs an app
#                   record in App Store Connect with bundle ID com.detourloop.app.
#
# Supabase public values are set in each workflow's vars below.
# Optional: add a variable group named "detourloop_public" (Codemagic → app → Environment variables)
# with EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_MAPBOX_TOKEN,
# EXPO_PUBLIC_WEB_URL, then uncomment the `groups:` lines. Without them the app runs in demo mode.

workflows:
  android-apk:
    name: DetourLoop · Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      node: 22
      java: 17
      vars:
        # Public Supabase values: safe in the app, access is enforced by row-level security.
        EXPO_PUBLIC_SUPABASE_URL: https://guiyyrtagdbiovobfmuu.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_lXqHl6RO9pQPvfw3ftYhTw_Xe-hXPJo
      # groups:
      #   - detourloop_public
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate android/)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build release APK
        script: |
          cd android
          # arm64 only: every Android phone from the last ~8 years; halves native compile time
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
    artifacts:
      # Paths resolve from working_directory (apps/mobile); the ** pattern is a fallback.
      - android/app/build/outputs/apk/release/*.apk
      - '**/build/outputs/apk/release/*.apk'
    # To get the download link by email after each build, uncomment and add your address:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com

  android-play:
    # Signed app bundle (.aab) for Google Play. Start it by hand (Start new build → android-play).
    # Needs the upload keystore in Codemagic → Code signing identities → Android keystores,
    # reference name "detourloop_upload". The keystore and its passwords stay in Codemagic, never in git.
    # The very first bundle is uploaded by hand in Play Console (Testing → Internal testing);
    # after that, uncomment `publishing:` below once a Google Play service account is connected.
    name: DetourLoop · Google Play bundle
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      node: 22
      java: 17
      android_signing:
        - detourloop_upload
      vars:
        EXPO_PUBLIC_SUPABASE_URL: https://guiyyrtagdbiovobfmuu.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_lXqHl6RO9pQPvfw3ftYhTw_Xe-hXPJo
        # RevenueCat public SDK key for the Google Play app (goog_…). Public by design.
        # EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: goog_xxxxxxxxxxxxxxxxxxxxxxxxxx
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate android/, adds release signing via plugins/withPlayRelease.js)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build signed app bundle
        script: |
          # Play needs a higher versionCode for every upload; this workflow's build number does that.
          export ANDROID_VERSION_CODE=$BUILD_NUMBER
          cd android
          # All CPU architectures: Play serves each phone only the part it needs.
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS   # secret variable group in Codemagic
    #     track: internal
    #     submit_as_draft: true

  ios-testflight:
    name: DetourLoop · iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    integrations:
      app_store_connect: DYNOMARK   # the App Store Connect API key already connected in Codemagic (works for every app in the Apple team)
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.detourloop.app
      vars:
        EXPO_PUBLIC_SUPABASE_URL: https://guiyyrtagdbiovobfmuu.supabase.co
        EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_lXqHl6RO9pQPvfw3ftYhTw_Xe-hXPJo
        XCODE_WORKSPACE: DetourLoop.xcworkspace   # generated by prebuild from app.json "name"
        XCODE_SCHEME: DetourLoop
        # RevenueCat public SDK key (App Store app in the DetoorLoop project). Public by design.
        EXPO_PUBLIC_REVENUECAT_IOS_KEY: appl_QPdpRZgpSKqrwcZpXezjonEAdxi
      # groups:
      #   - detourloop_public
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate ios/)
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: cd ios && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - '**/build/ios/ipa/*.ipa'
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Builds land in TestFlight for internal testers (no review needed).
        # For external testers: fill in TestFlight → Test Information in App Store Connect,
        # then set this to true to submit each build to beta review.
        submit_to_testflight: false
