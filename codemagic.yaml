# DetourLoop — Codemagic CI/CD
# Repo root = this folder (detour/). The mobile app lives in apps/mobile.
#
# Workflows
#   android-apk     Installable APK for testing on any Android phone. No setup needed:
#                   until you upload a keystore, the release APK is signed with the debug key
#                   (fine for sideloading, not for Google Play).
#   ios-testflight  IPA uploaded to TestFlight. Uses the App Store Connect API key "DYNOMARK"
#                   (Codemagic → Settings → Integrations → Developer Portal) and needs an app
#                   record in App Store Connect with bundle ID com.detourloop.app.
#
# Optional: add a variable group named "detourloop_public" (Codemagic → app → Environment variables)
# with EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_MAPBOX_TOKEN,
# EXPO_PUBLIC_WEB_URL, then uncomment the `groups:` lines. Without them the app runs in demo mode.

workflows:
  android-apk:
    name: DetourLoop · Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    environment:
      node: 22
      java: 17
      # groups:
      #   - detourloop_public
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate android/)
        script: npx expo prebuild --platform android --clean --no-install
      - name: Point Gradle at the Android SDK
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build release APK
        script: |
          cd android
          # arm64 only: every Android phone from the last ~8 years; halves native compile time
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
    artifacts:
      # Paths resolve from working_directory (apps/mobile); the ** pattern is a fallback.
      - android/app/build/outputs/apk/release/*.apk
      - '**/build/outputs/apk/release/*.apk'
    # To get the download link by email after each build, uncomment and add your address:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com

  ios-testflight:
    name: DetourLoop · iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    integrations:
      app_store_connect: DYNOMARK   # the App Store Connect API key already connected in Codemagic (works for every app in the Apple team)
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.detourloop.app
      vars:
        XCODE_WORKSPACE: DetourLoop.xcworkspace   # generated by prebuild from app.json "name"
        XCODE_SCHEME: DetourLoop
      # groups:
      #   - detourloop_public
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Expo prebuild (generate ios/)
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: cd ios && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - '**/build/ios/ipa/*.ipa'
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
